<style>
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151010; --glass:rgba(32,24,22,.9); --solid:#231a18; --ink:#f1e8e2; --muted:#b09e96;
    --line:rgba(241,232,226,.10); --brand:#0f0a09; --brand-ink:#f3e6d6; --gold:#e0ac72;
    --s0:#4a3d38; --s1:#9c7342; --s2:#d07a3e; --s3:#f06a4a; --fish:#6cc3d2; --osm:#7d716b;
    --shadow:0 10px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#151010; --glass:rgba(32,24,22,.9); --solid:#231a18; --ink:#f1e8e2; --muted:#b09e96;
  --line:rgba(241,232,226,.10); --brand:#0f0a09; --brand-ink:#f3e6d6; --gold:#e0ac72;
  --s0:#4a3d38; --s1:#9c7342; --s2:#d07a3e; --s3:#f06a4a; --fish:#6cc3d2; --osm:#7d716b;
  --shadow:0 10px 40px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;font-size:14px;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
#map{position:fixed;inset:0;z-index:0;background:var(--bg)}
.leaflet-container{font-family:inherit;background:var(--bg)}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.95)}
.leaflet-control-attribution{font-size:10px;background:var(--glass)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-tooltip{font-family:inherit;border:none;border-radius:8px;box-shadow:var(--shadow);background:var(--solid);color:var(--ink)}
.leaflet-tooltip:before{display:none}

.top{position:fixed;z-index:10;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));

.brand{pointer-events:auto;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:10px 16px;

.brand h1 b{color:var(--gold)}
.brand small{font-size:11px;opacity:.75;white-space:nowrap}
.filters{pointer-events:auto;flex:1;min-width:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);

.row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:none;font:inherit;font-size:13px;color:var(--ink);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.sel{flex:1;min-width:110px;font:inherit;font-size:13px;color:var(--ink);background:var(--solid);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.tog{flex:0 0 auto;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--solid);color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer}
.tog.on{color:var(--solid);background:var(--ink);border-color:var(--ink)}
.tog.fish.on{background:var(--fish);border-color:var(--fish)}

.sheet{position:fixed;z-index:9;right:16px;top:calc(104px + env(safe-area-inset-top));bottom:16px;width:420px;

  display:flex;flex-direction:column;overflow:hidden}
.handle{display:none}
.scroll{overflow:auto;padding:18px 18px 24px;flex:1;overscroll-behavior:contain}
.kicker{font-size:11px;letter-spacing:.14em;color:var(--muted)}
h2{font-family:"Shippori Mincho B1",serif;font-size:21px;margin:4px 0 6px;line-height:1.35}
.lead{color:var(--muted);font-size:12.5px;line-height:1.7;margin:0 0 12px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;

.card:hover{border-color:var(--gold)}
.rank{font-family:"Shippori Mincho B1",serif;font-size:17px;color:var(--gold);text-align:center}
.nm{font-weight:700;font-size:14px;line-height:1.35}
.pf{font-size:11.5px;color:var(--muted);margin-top:2px}
.sc{min-width:38px;text-align:center;font-weight:700;font-size:13px;border-radius:10px;padding:4px 6px;color:#fff}
.price{font-size:12px;color:var(--ink);text-align:right;white-space:nowrap}
.back{font:inherit;font-size:12px;border:none;background:transparent;color:var(--s3);padding:0;cursor:pointer;margin-bottom:6px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 12px}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--s0);color:var(--ink)}
.badge.w{background:var(--s3);color:#fff}
.badge.f{background:var(--fish);color:#fff}
dl{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:0 0 14px;font-size:13px;line-height:1.6}
dt{color:var(--muted)}
dd{margin:0}
.warn{font-size:12.5px;line-height:1.7;background:var(--solid);border-left:3px solid var(--s3);padding:8px 10px;border-radius:6px;margin:0 0 12px}
.src{font-size:12px;color:var(--muted);line-height:1.7;margin:0}
.src a,dd a{color:var(--s3)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:0 0 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.foot{font-size:11px;color:var(--muted);line-height:1.7;margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.foot a{color:var(--muted)}
.empty{color:var(--muted);font-size:13px}

@media (max-width:760px){
  .top{flex-direction:column;gap:8px;left:16px;right:16px}
  .brand{padding:8px 14px}
  .brand h1{font-size:17px}
  .sheet{left:0;right:0;width:auto;top:auto;bottom:0;height:46vh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .sheet.min{height:92px}
  .sheet.max{height:82vh}
  .handle{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:0 0 auto;cursor:pointer}
  .scroll{padding:10px 16px 20px}
  dl{grid-template-columns:84px 1fr}
}
</style>

    D.osm.filter(o=>!S.pref||o.pref===S.pref||S.mode==="hyaku").forEach(o=>{
      L.circleMarker([o.lat,o.lon],{radius:4,weight:1,color:css("--solid"),fillColor:css("--osm"),fillOpacity:.8})
       .bindTooltip(`${esc(o.name)}（${esc(o.kind)}・料金未確認）`).addTo(layers.osm);
    });
  }
  if(S.fish){
    D.fish.forEach(a=>{
      L.circleMarker([a.lat,a.lng],{radius:6,weight:2,color:css("--fish"),fillColor:css("--solid"),fillOpacity:1})
       .bindTooltip(`釣り場：${esc(a.name)}`).addTo(layers.fish);
    });
  }
}

function legend(){
  const m=maxScore[S.mode];
  return `<div class="legend"><span><i style="background:${css("--s3")}"></i>指数${Math.ceil(m*.8)}以上</span>
  <span><i style="background:${css("--s2")}"></i>${Math.ceil(m*.6)}〜</span><span><i style="background:${css("--s1")}"></i>${Math.ceil(m*.4)}〜</span>
  <span><i style="background:${css("--s0")}"></i>それ未満</span>${S.osm?`<span><i style="background:${css("--osm")}"></i>未調査</span>`:""}
  ${S.fish?`<span><i style="background:var(--solid);box-shadow:inset 0 0 0 2px ${css("--fish")}"></i>釣り場</span>`:""}</div>`;
}

function listView(){
  const it=items();
  const title=S.mode==="hyaku"?"全国百名湯":"関西の日帰り温泉";
  const lead=S.mode==="hyaku"
    ?"松田忠徳『日本百名湯』の100湯。代表的な日帰り施設の料金と、最寄りの道の駅・RVパークまでの距離から、釣り・車中泊向けの指数（0〜7点）で並べています。"
    :"関西の釣り場45エリアの近くにある日帰り温泉。釣り場・車中泊スポットまでの距離、料金、閉館時刻から指数（0〜10点）で並べています。";
  $("#body").innerHTML=`<div class="kicker">${S.pref||"すべての地域"}・${it.length}件</div><h2>${title}</h2>
  <p class="lead">${lead}</p>${legend()}
  <div class="cards">${it.map((x,i)=>`<div class="card" data-k="${esc(x.key)}">
    <div class="rank">${i+1}</div>
    <div><div class="nm">${esc(x.name)}</div><div class="pf">${esc(x.pref)}${x.facility&&x.facility!==x.name?"・"+esc(x.facility):""}</div></div>
    <div><div class="sc" style="background:${scoreColor(x.score,S.mode)}">${x.score}</div><div class="price">${yen(x.price)}</div></div>
  </div>`).join("")||'<p class="empty">該当なし</p>'}</div>${foot()}`;
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>select(c.dataset.k,true));
}

function detailView(x){
  const warn=/休業|休止|不可|閉館/.test((x.price||"")+(x.facility||""))?`<p class="warn">${esc(x.price)}。${esc(x.note)}</p>`:"";
  const fishRow=S.mode==="kansai"?`<dt>近い釣り場</dt><dd>${(x.areas||[]).map(a=>`${esc(a.name)}（${a.km}km）`).join("<br>")}</dd>`:"";
  $("#body").innerHTML=`<button class="back" id="back">← 一覧に戻る</button>
  <div class="kicker">${esc(x.pref)}</div><h2>${esc(x.name)}</h2>
  <div class="badges"><span class="badge w">指数 ${x.score}</span>${(x.types||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join("")}
   ${x.close_h>=24?'<span class="badge f">深夜営業</span>':""}</div>${warn}
  <dl>
   ${x.facility&&x.facility!==x.name?`<dt>代表施設</dt><dd>${esc(x.facility)}</dd>`:""}
   <dt>料金（大人）</dt><dd>${yen(x.price)}</dd>
   <dt>時間</dt><dd>${esc(x.hours)||"—"}${x.holiday?`<br><span class="pf">休み：${esc(x.holiday)}</span>`:""}</dd>
   ${x.quality?`<dt>泉質</dt><dd>${esc(x.quality)}</dd>`:""}
   ${x.indications?`<dt>効能</dt><dd>${esc(x.indications).replace(/ \/ /g,"<br>")}<br><span class="pf">環境省の泉質別適応症（浴用）に当てたもの</span></dd>`:""}
   <dt>車中泊</dt><dd>${esc(x.eki)} ${x.eki_km}km<br>${esc(x.rv)} ${x.rv_km}km</dd>
   ${fishRow}
   <dt>指数の内訳</dt><dd>${esc(x.score_why)}</dd>
   ${x.note&&!warn?`<dt>備考</dt><dd>${esc(x.note)}</dd>`:""}
  </dl>
  <p class="src">料金の出典：${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.src)}</a>`:esc(x.src||"—")}（2026年11月に確認）。
  ${x.wikipedia?`<br>泉質：<a href="${esc(x.wikipedia)}" target="_blank" rel="noopener">Wikipedia</a>`:""}
  ${x.approx?"<br>※位置は町域の代表点です。":""}</p>${foot()}`;
  $("#back").onclick=()=>{S.sel=null;drawMarkers();listView()};
}

function foot(){return `<div class="foot">料金・時間は旅行サイト等の掲載値で、変わっていることがあります。行く前に施設へ確認してください。
 道の駅は宿泊目的の利用に遠慮が求められています（仮眠は可）。距離はすべて直線距離です。<br>
 出典：Wikipedia（CC BY-SA 4.0）／© OpenStreetMap contributors（ODbL）／国土交通省「道の駅」登録一覧／環境省「あんしん・あんぜんな温泉利用のいろは」／地図：国土地理院。更新 ${esc(D.updated)}</div>`}

function select(k,fly){
  const x=(S.mode==="hyaku"?D.hyaku:D.kansai).find(y=>y.key===k);if(!x)return;
  S.sel=k;drawMarkers();detailView(x);
  if(fly)map.flyTo([x.lat,x.lon],Math.max(map.getZoom(),10),{duration:.6});
  if(innerWidth<=760)$("#sheet").className="sheet";
}

function fit(){
  const it=items();if(!it.length)return;
  map.invalidateSize();
  if(!map.getSize().x){requestAnimationFrame(fit);return}
  map.fitBounds(L.latLngBounds(it.map(x=>[x.lat,x.lon])).pad(.15),{paddingTopLeft:[16,innerWidth<=760?120:110],paddingBottomRight:[innerWidth<=760?16:450,innerWidth<=760?innerHeight*.46:16]});
}
function render(fitMap){
  document.querySelectorAll("#modes .chip").forEach(b=>b.classList.toggle("on",b.dataset.mode===S.mode));
  $("#pref").innerHTML=`<option value="">${S.mode==="hyaku"?"全国":"関西すべて"}</option>`+prefs().map(p=>`<option ${p===S.pref?"selected":""}>${esc(p)}</option>`).join("");
  $("#tOsm").style.display=S.mode==="kansai"?"":"none";
  $("#tOsm").classList.toggle("on",S.osm);$("#tFish").classList.toggle("on",S.fish);
  drawMarkers();listView();if(fitMap)fit();
}
document.querySelectorAll("#modes .chip").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;S.pref="";S.sel=null;
  if(S.mode==="hyaku")S.osm=false;try{localStorage.setItem("onsenMode",S.mode)}catch(e){}render(true)});
$("#pref").onchange=e=>{S.pref=e.target.value;S.sel=null;render(true)};
$("#tOsm").onclick=()=>{S.osm=!S.osm;render(false)};
$("#tFish").onclick=()=>{S.fish=!S.fish;render(false)};
$("#handle").onclick=()=>{const s=$("#sheet");s.className=s.classList.contains("min")?"sheet":s.classList.contains("max")?"sheet min":"sheet max"};
render(false);
requestAnimationFrame(fit);
addEventListener("load",fit,{once:true});
</script>
</body>
</html>
